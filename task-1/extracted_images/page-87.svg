<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<rect width="900" height="560" fill="#ffffff"/>
<text x="40" y="42" font-size="20" font-weight="800" fill="#1e2540">Brick manufacturing process</text>
<text x="40" y="64" font-size="13" fill="#4b5373">8 stages, from clay to delivery</text>
<rect x="60" y="150" width="180" height="92" rx="12" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/>
<circle cx="86" cy="176" r="13" fill="#2563eb"/>
<text x="86" y="181" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">1</text>
<text x="110" y="180" font-size="15" font-weight="700" fill="#1e2540">Clay dug up</text>
<text x="110" y="200" font-size="12" fill="#4b5373">by a large digger</text>
<rect x="258" y="150" width="180" height="92" rx="12" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-width="2"/>
<circle cx="284" cy="176" r="13" fill="#10b981"/>
<text x="284" y="181" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">2</text>
<text x="308" y="180" font-size="15" font-weight="700" fill="#1e2540">Metal grid</text>
<text x="308" y="200" font-size="12" fill="#4b5373">breaks clay into pieces</text>
<rect x="456" y="150" width="180" height="92" rx="12" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-width="2"/>
<circle cx="482" cy="176" r="13" fill="#f59e0b"/>
<text x="482" y="181" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">3</text>
<text x="506" y="180" font-size="15" font-weight="700" fill="#1e2540">Sand & water</text>
<text x="506" y="200" font-size="12" fill="#4b5373">added to the clay</text>
<rect x="654" y="150" width="180" height="92" rx="12" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-width="2"/>
<circle cx="680" cy="176" r="13" fill="#8b5cf6"/>
<text x="680" y="181" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">4</text>
<text x="704" y="180" font-size="15" font-weight="700" fill="#1e2540">Mould or wire cut</text>
<text x="704" y="200" font-size="12" fill="#4b5373">clay shaped into bricks</text>
<rect x="654" y="360" width="180" height="92" rx="12" fill="#06b6d4" fill-opacity="0.10" stroke="#06b6d4" stroke-width="2"/>
<circle cx="680" cy="386" r="13" fill="#06b6d4"/>
<text x="680" y="391" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">5</text>
<text x="704" y="390" font-size="15" font-weight="700" fill="#1e2540">Drying oven</text>
<text x="704" y="410" font-size="12" fill="#4b5373">24–48 hours</text>
<rect x="456" y="360" width="180" height="92" rx="12" fill="#ef4444" fill-opacity="0.10" stroke="#ef4444" stroke-width="2"/>
<circle cx="482" cy="386" r="13" fill="#ef4444"/>
<text x="482" y="391" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">6</text>
<text x="506" y="390" font-size="15" font-weight="700" fill="#1e2540">Kiln heating</text>
<text x="506" y="410" font-size="12" fill="#4b5373">200°C – 1300°C</text>
<rect x="258" y="360" width="180" height="92" rx="12" fill="#ec4899" fill-opacity="0.10" stroke="#ec4899" stroke-width="2"/>
<circle cx="284" cy="386" r="13" fill="#ec4899"/>
<text x="284" y="391" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">7</text>
<text x="308" y="390" font-size="15" font-weight="700" fill="#1e2540">Cooling chamber</text>
<text x="308" y="410" font-size="12" fill="#4b5373">48–72 hours</text>
<rect x="60" y="360" width="180" height="92" rx="12" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/>
<circle cx="86" cy="386" r="13" fill="#2563eb"/>
<text x="86" y="391" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">8</text>
<text x="110" y="390" font-size="15" font-weight="700" fill="#1e2540">Packed & delivered</text>
<text x="110" y="410" font-size="12" fill="#4b5373">to customers</text>
<path d="M 240 196 h 24" stroke="#4b5373" stroke-width="2.5" marker-end="url(#arr2)"/>
<path d="M 438 196 h 24" stroke="#4b5373" stroke-width="2.5" marker-end="url(#arr2)"/>
<path d="M 636 196 h 24" stroke="#4b5373" stroke-width="2.5" marker-end="url(#arr2)"/>
<path d="M 744 242 v 104" stroke="#4b5373" stroke-width="2.5" marker-end="url(#arr2)"/>
<path d="M 258 406 h -24" stroke="#4b5373" stroke-width="2.5" marker-end="url(#arr2l)"/>
<path d="M 456 406 h -24" stroke="#4b5373" stroke-width="2.5" marker-end="url(#arr2l)"/>
<path d="M 654 406 h -24" stroke="#4b5373" stroke-width="2.5" marker-end="url(#arr2l)"/>
<defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4b5373"/></marker><marker id="arr2l" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto"><path d="M6,0 L0,3 L6,6 Z" fill="#4b5373"/></marker></defs>
</svg>
