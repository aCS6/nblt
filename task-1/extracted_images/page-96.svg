<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<rect width="900" height="620" fill="#ffffff"/>
<text x="40" y="42" font-size="20" font-weight="800" fill="#1e2540">Life cycle of a frog</text>
<text x="40" y="64" font-size="13" fill="#4b5373">a natural cycle — pick any starting point</text>
<circle cx="450" cy="130" r="46" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2.5"/>
<text x="450" y="122" font-size="14" font-weight="800" fill="#1e2540" text-anchor="middle">Eggs</text>
<text x="450" y="140" font-size="10" fill="#4b5373" text-anchor="middle">frogspawn floats</text>
<text x="450" y="152" font-size="10" fill="#4b5373" text-anchor="middle">on the water</text>
<text x="558" y="180" font-size="18" fill="#4b5373" text-anchor="middle">→</text>
<circle cx="667" cy="230" r="46" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2.5"/>
<text x="667" y="222" font-size="14" font-weight="800" fill="#1e2540" text-anchor="middle">Small tadpole</text>
<text x="667" y="240" font-size="10" fill="#4b5373" text-anchor="middle">hatches with a</text>
<text x="667" y="252" font-size="10" fill="#4b5373" text-anchor="middle">tail & small body</text>
<text x="667" y="330" font-size="18" fill="#4b5373" text-anchor="middle">→</text>
<circle cx="667" cy="430" r="46" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2.5"/>
<text x="667" y="422" font-size="14" font-weight="800" fill="#1e2540" text-anchor="middle">Growing tadpole</text>
<text x="667" y="440" font-size="10" fill="#4b5373" text-anchor="middle">body grows,</text>
<text x="667" y="452" font-size="10" fill="#4b5373" text-anchor="middle">legs begin to form</text>
<text x="558" y="480" font-size="18" fill="#4b5373" text-anchor="middle">→</text>
<circle cx="450" cy="530" r="46" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="2.5"/>
<text x="450" y="522" font-size="14" font-weight="800" fill="#1e2540" text-anchor="middle">Young frog</text>
<text x="450" y="540" font-size="10" fill="#4b5373" text-anchor="middle">wider mouth, shorter</text>
<text x="450" y="552" font-size="10" fill="#4b5373" text-anchor="middle">tail, larger legs</text>
<text x="342" y="480" font-size="18" fill="#4b5373" text-anchor="middle">→</text>
<circle cx="233" cy="430" r="46" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="2.5"/>
<text x="233" y="422" font-size="14" font-weight="800" fill="#1e2540" text-anchor="middle">Mature frog</text>
<text x="233" y="440" font-size="10" fill="#4b5373" text-anchor="middle">leaves the water,</text>
<text x="233" y="452" font-size="10" fill="#4b5373" text-anchor="middle">breathes air</text>
<text x="233" y="330" font-size="18" fill="#4b5373" text-anchor="middle">→</text>
<circle cx="233" cy="230" r="46" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="2.5"/>
<text x="233" y="222" font-size="14" font-weight="800" fill="#1e2540" text-anchor="middle">Adult frog</text>
<text x="233" y="240" font-size="10" fill="#4b5373" text-anchor="middle">finds a mate and</text>
<text x="233" y="252" font-size="10" fill="#4b5373" text-anchor="middle">lays eggs</text>
<text x="342" y="180" font-size="18" fill="#4b5373" text-anchor="middle">→</text>
<circle cx="450" cy="330" r="52" fill="#f4f6fb" stroke="#dde3ef" stroke-width="2"/>
<text x="450" y="324" font-size="15" font-weight="800" fill="#1e2540" text-anchor="middle">CYCLE</text>
<text x="450" y="342" font-size="11" fill="#4b5373" text-anchor="middle">starts again</text>
</svg>
