<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<text x="40" y="42" font-size="20" font-weight="800" fill="#1e2540">Process / Flow chart</text>
<text x="40" y="64" font-size="13" fill="#4b5373">a method, step by step</text>
<rect x="46" y="150" width="160" height="88" rx="14" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/>
<text x="126" y="188" font-size="16" font-weight="700" fill="#1e2540" text-anchor="middle">Raw material</text>
<text x="126" y="212" font-size="12" fill="#4b5373" text-anchor="middle">step 1</text>
<circle cx="126" cy="150" r="12" fill="#2563eb"/>
<text x="126" y="155" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<path d="M 206 194 h 34" stroke="#4b5373" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="240" y="150" width="160" height="88" rx="14" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-width="2"/>
<text x="320" y="188" font-size="16" font-weight="700" fill="#1e2540" text-anchor="middle">Processing</text>
<text x="320" y="212" font-size="12" fill="#4b5373" text-anchor="middle">step 2</text>
<circle cx="320" cy="150" r="12" fill="#10b981"/>
<text x="320" y="155" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<path d="M 400 194 h 34" stroke="#4b5373" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="434" y="150" width="160" height="88" rx="14" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-width="2"/>
<text x="514" y="188" font-size="16" font-weight="700" fill="#1e2540" text-anchor="middle">Quality check</text>
<text x="514" y="212" font-size="12" fill="#4b5373" text-anchor="middle">step 3</text>
<circle cx="514" cy="150" r="12" fill="#f59e0b"/>
<text x="514" y="155" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<path d="M 594 194 h 34" stroke="#4b5373" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="628" y="150" width="160" height="88" rx="14" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-width="2"/>
<text x="708" y="188" font-size="16" font-weight="700" fill="#1e2540" text-anchor="middle">Finished product</text>
<text x="708" y="212" font-size="12" fill="#4b5373" text-anchor="middle">done</text>
<circle cx="708" cy="150" r="12" fill="#8b5cf6"/>
<text x="708" y="155" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4b5373"/></marker></defs>
</svg>
