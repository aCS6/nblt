<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- ── SEO & PWA meta ── -->
  <meta name="description" content="IELTS Academic Writing Task 1 interactive study hub — band descriptors, vocabulary banks, annotated samples, and practice quizzes for 8+ band scores." />
  <meta name="theme-color" content="#2563eb" />
  <meta name="color-scheme" content="light" />
  <!-- Open Graph for link sharing -->
  <meta property="og:title" content="IELTS Task 1 Study Hub" />
  <meta property="og:description" content="Visual, interactive training gym for IELTS Academic Writing Task 1 — built for 8+ band scores." />
  <meta property="og:type" content="website" />
  <title>IELTS Task 1 Study Hub — Learn by Seeing, Not Reading</title>  <link rel="stylesheet" href="../assets/fonts-task1.css">
  <link rel="stylesheet" href="css/style.css" />

  <!-- NBLT hub: floating "back to home" pill. Optional — the app runs without it. -->
  <script defer src="../assets/nblt-home.js"></script>
</head>
<body>
  <!-- ── Accessibility: skip-to-content for keyboard/screen reader users ── -->
  <a href="#content" class="skip-link">Skip to main content</a>

  <div class="app">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-badge">🎯</span>
          <div class="brand-text">
            <span class="brand-title">IELTS Task 1</span>
            <span class="brand-sub">Study Hub</span>
          </div>
        </div>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
      </div>

      <div class="progress-wrap">
        <div class="progress-info">
          <span>Your progress</span>
          <span class="progress-count" id="progressCount">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p class="progress-hint" id="progressHint">Finish every chapter to be exam-ready ✨</p>
      </div>

      <nav class="nav" id="nav" aria-label="Chapters"></nav>

      <div class="sidebar-foot">
        <p>Made for students who want to <strong>see</strong> IELTS, not just read it.</p>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ===== Main ===== -->
    <main class="main" id="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <div class="topbar-title" id="topbarTitle">IELTS Task 1 Study Hub</div>
        <div class="topbar-tools">
          <a class="tool-btn cheat-link" href="cheat-sheet.html" title="Printable Template Vault cheat sheet" aria-label="Open the printable Template Vault cheat sheet">📄</a>
          <button class="tool-btn" id="resetBtn" title="Reset progress" aria-label="Reset progress">↺</button>
        </div>
      </header>

      <div class="content" id="content" tabindex="-1"></div>

      <footer class="content-foot">
        <button class="foot-prev" id="footPrev">← Previous chapter</button>
        <div class="foot-pager" id="footPager"></div>
        <button class="foot-next" id="footNext">Next chapter →</button>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/chapters-part1.js"></script>
  <script src="js/chapters-part2.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
