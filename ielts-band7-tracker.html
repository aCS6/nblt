<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Band 7+ Tracker — August 2026</title>
<!-- NBLT hub: floating "back to home" pill. Optional — the app runs without it. -->
<script defer src="assets/nblt-home.js"></script>
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3352;
  --accent:#5b7fff; --accent2:#a78bfa; --green:#22c55e; --greendim:#16a34a33;
  --yellow:#f59e0b; --red:#ef4444; --text:#e2e8f0; --dim:#94a3b8; --dimmer:#475569;
  --cr:#f87171; --cl:#60a5fa; --cw:#34d399; --cs:#f472b6; --cv:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

/* HEADER */
header{
  background:linear-gradient(135deg,#1a1d27,#12152a);
  border-bottom:1px solid var(--border);
  padding:20px 28px;position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.h-title h1{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.h-title h1 span{color:var(--accent)}
.h-title p{color:var(--dim);font-size:.78rem;margin-top:2px}
.h-stats{display:flex;gap:12px;flex-wrap:wrap;flex:1;justify-content:center}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:7px 14px;text-align:center;min-width:72px}
.stat .v{font-size:1.4rem;font-weight:800;color:var(--accent);line-height:1}
.stat .l{font-size:.65rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.band-box{background:linear-gradient(135deg,#5b7fff22,#a78bfa22);
  border:1.5px solid var(--accent);border-radius:12px;padding:10px 18px;text-align:center}
.band-box .bn{font-size:2rem;font-weight:900;color:var(--accent);line-height:1}
.band-box .bl{font-size:.65rem;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em}

/* PROGRESS */
.prog-wrap{padding:16px 28px 0}
.prog-track{background:var(--surface2);border-radius:99px;height:9px;
  overflow:hidden;border:1px solid var(--border)}
.prog-fill{height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .6s cubic-bezier(.4,0,.2,1)}
.prog-lbl{display:flex;justify-content:space-between;
  margin-top:5px;font-size:.72rem;color:var(--dim)}

/* STREAK */
.streak{margin:14px 28px 0;padding:10px 18px;
  background:linear-gradient(90deg,#f59e0b0d,#f59e0b1a);
  border:1px solid #f59e0b44;border-radius:10px;
  display:flex;align-items:center;gap:10px;font-size:.8rem}
.streak strong{color:var(--yellow)}

/* WEEKS */
.weeks{padding:24px 28px;display:flex;flex-direction:column;gap:28px}
.wk-head{display:flex;align-items:center;gap:12px;
  margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.wk-badge{background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:800;font-size:.7rem;border-radius:7px;
  padding:3px 11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.wk-info{flex:1}
.wk-name{font-size:.95rem;font-weight:700}
.wk-target{font-size:.74rem;color:var(--dim);margin-top:2px}
.wk-pct{font-size:.8rem;color:var(--accent2);font-weight:700;white-space:nowrap}

/* GRID */
.days-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;transition:box-shadow .2s,border-color .2s;
  position:relative}
.card:hover{box-shadow:0 4px 24px #00000055;border-color:#3e4570}
.card.done{border-color:var(--green);background:linear-gradient(135deg,#1a1d27,#0f1f0f)}
.card.today{border-color:var(--accent);box-shadow:0 0 0 2px #5b7fff2a}
.card.locked{opacity:.4;pointer-events:none}

/* CARD TOP */
.ctop{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.dnum{width:40px;height:40px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1rem;background:var(--surface2);color:var(--dim);
  transition:background .2s,color .2s}
.card.done .dnum{background:var(--green);color:#fff}
.card.today .dnum{background:var(--accent);color:#fff}
.cmeta{flex:1;min-width:0}
.cdate{font-size:.68rem;color:var(--dimmer);margin-bottom:1px}
.ctitle{font-size:.85rem;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbadges{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.sb{font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:99px;
  text-transform:uppercase;letter-spacing:.04em}
.sb-R{background:#f8717122;color:var(--cr);border:1px solid #f8717144}
.sb-L{background:#60a5fa22;color:var(--cl);border:1px solid #60a5fa44}
.sb-W{background:#34d39922;color:var(--cw);border:1px solid #34d39944}
.sb-S{background:#f472b622;color:var(--cs);border:1px solid #f472b644}
.sb-V{background:#a78bfa22;color:var(--cv);border:1px solid #a78bfa44}
.sb-G{background:#f59e0b22;color:var(--yellow);border:1px solid #f59e0b44}
.sb-MOCK{background:#ef444422;color:var(--red);border:1px solid #ef444444}
.tick{width:26px;height:26px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  background:var(--surface2);color:var(--dimmer);transition:background .15s,color .15s}
.card.done .tick{background:var(--green);color:#fff}
.done-stamp{display:none;position:absolute;top:9px;right:12px;
  font-size:.6rem;font-weight:800;color:var(--green);
  background:#22c55e1a;border:1px solid #22c55e44;
  border-radius:5px;padding:1px 7px;letter-spacing:.07em;text-transform:uppercase}
.card.done .done-stamp{display:block}

/* EXPAND BODY */
.cbody{max-height:0;overflow:hidden;transition:max-height .35s ease}
.card.open .cbody{max-height:1200px}

/* HOURS */
.hours{border-top:1px solid var(--border)}
.hr{display:flex;gap:8px;padding:7px 14px;
  align-items:flex-start;border-bottom:1px solid #1e2235}
.hr:last-child{border-bottom:none}
.hlbl{font-size:.65rem;font-weight:700;color:var(--accent2);
  white-space:nowrap;padding-top:1px;min-width:22px;text-transform:uppercase}
.hchk{width:17px;height:17px;border-radius:4px;flex-shrink:0;
  border:2px solid var(--border);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:transparent;transition:background .12s,border-color .12s;margin-top:1px}
.hchk.on{background:var(--green);border-color:var(--green)}
.hchk.on::after{content:'✓';color:#fff;font-size:10px;font-weight:800}
.htxt{font-size:.76rem;color:var(--dim);line-height:1.5;flex:1}
.htxt a{color:var(--accent);text-decoration:none;font-size:.7rem}
.htxt a:hover{text-decoration:underline}
.htxt strong{color:var(--text)}

/* LINKS ROW */
.clinks{border-top:1px solid var(--border);padding:7px 14px;
  display:flex;gap:5px;flex-wrap:wrap}
.lchip{font-size:.66rem;color:var(--accent);background:#5b7fff11;
  border:1px solid #5b7fff33;border-radius:5px;padding:2px 7px;
  text-decoration:none;white-space:nowrap}
.lchip:hover{background:#5b7fff22}
.lchip-read{color:var(--accent2);background:#a78bfa14;
  border:1px solid #a78bfa55;font-weight:600;letter-spacing:.01em}
.lchip-read:hover{background:#a78bfa26}

/* COMPLETE BUTTON */
.cbtn{margin:8px 14px 12px;width:calc(100% - 28px);padding:8px;
  border-radius:9px;border:1.5px solid var(--green);background:transparent;
  color:var(--green);font-size:.8rem;font-weight:700;cursor:pointer;
  transition:background .12s,color .12s;letter-spacing:.03em}
.cbtn:hover{background:var(--green);color:#fff}
.card.done .cbtn{background:var(--greendim);color:var(--green)}

/* TOAST */
#toast{position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--surface);border:1px solid var(--green);border-radius:12px;
  padding:12px 24px;font-size:.88rem;font-weight:600;
  box-shadow:0 4px 24px #00000055;z-index:9999;
  transition:transform .4s ease;white-space:nowrap;color:var(--green)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* CONFETTI */
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:9998}

@media(max-width:600px){
  header{padding:14px 14px}
  .weeks{padding:14px 14px}
  .prog-wrap{padding:12px 14px 0}
  .days-grid{grid-template-columns:1fr}
  .streak{margin:12px 14px 0}
}
</style>

<canvas id="confetti-canvas"></canvas>

<header>
  <div class="h-title">
    <h1>IELTS <span>Band 7+</span> Journey</h1>

    <div class="stat"><div class="v" id="s-streak">0</div><div class="l">🔥 Streak</div></div>
    <div class="stat"><div class="v" id="s-pct">0%</div><div class="l">Progress</div></div>
  </div>
  <div class="band-box">
    <div class="bn">7+</div>
    <div class="bl">Target Band</div>
  </div>
</header>

<div class="prog-wrap">
  <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="prog-lbl">
    <span id="prog-d1">Day 1 · Start when ready</span>
    <span id="prog-txt">0 / 31 days</span>
    <span id="prog-d31">Day 31 · +31 days</span>
  </div>
</div>

<div class="streak" id="streak-bar" style="display:none">
  <span style="font-size:1.2rem">🔥</span>
  <span>You're on a <strong id="streak-num">0</strong>-day streak — keep it going!</span>
</div>

<div class="weeks" id="app"></div>

// ── DYNAMIC START DATE ────────────────────────────────────────────────────────
// Start date is recorded the first time the user completes Day 1.
// Every subsequent "today" is calculated as: startDate + (dayNum - 1) calendar days.
// Before Day 1 is completed, Day 1 is always "today" and all others are locked.

function getStartDate() {
  const state = getState();
  return state.__startDate ? new Date(state.__startDate) : null;
}

function setStartDate(dateStr) {
  const state = getState();
  state.__startDate = dateStr;
  saveState(state);
}

/** Returns the calendar date for a given plan day number (1-indexed). */
function dateForDay(dayNum) {
  const start = getStartDate();
  if (!start) return null;
  const d = new Date(start);
  d.setDate(d.getDate() + (dayNum - 1));
  return d;
}

/** Returns the plan day number that corresponds to today's calendar date.
 *  Before start is set: returns 1 (so Day 1 is always "today" initially).
 *  After start is set: clamps between 1 and 31. */
function todayDayNum() {
  const start = getStartDate();
  if (!start) return 1; // not started yet — Day 1 is today
  const now = new Date();
  // zero out time for clean day-diff
  const startMid = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const nowMid   = new Date(now.getFullYear(),   now.getMonth(),   now.getDate());
  const diff = Math.floor((nowMid - startMid) / 86400000) + 1;
  return Math.max(1, Math.min(31, diff));
}

/** Format a Date object as "Mon 4 Aug" style */
function fmtDate(d) {
  if (!d) return '';
  return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
}

function getState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

// ── CONFETTI ──────────────────────────────────────────────────────────────────
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const pieces = Array.from({length:120}, () => ({
    x: Math.random()*canvas.width,
    y: Math.random()*-canvas.height,
    r: Math.random()*7+3,
    d: Math.random()*80+20,
    color: ['#5b7fff','#22c55e','#f59e0b','#a78bfa','#f472b6','#60a5fa'][Math.floor(Math.random()*6)],
    tilt: Math.random()*10-5,
    tiltAngle: 0, tiltSpeed: Math.random()*0.1+0.05,
  }));
  let frame=0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.tiltAngle += p.tiltSpeed;
      p.y += (Math.cos(frame/20+p.d)+1.5)/2*3;
      p.x += Math.sin(frame/20)*2;
      p.tilt = Math.sin(p.tiltAngle)*12;
      ctx.beginPath();
      ctx.lineWidth = p.r;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x+p.tilt+p.r/3, p.y);
      ctx.lineTo(p.x+p.tilt, p.y+p.tilt+p.r/3);
      ctx.stroke();
    });
    frame++;
    if(frame < 180) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ── STREAK ────────────────────────────────────────────────────────────────────
function calcStreak(state) {
  let streak = 0;
  for(let d = todayDayNum(); d >= 1; d--) {
    if(state[d] && state[d].done) streak++;
    else break;
  }
  return streak;
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function updateStats() {
  const state = getState();
  let done = 0;
  for(let d=1;d<=31;d++) if(state[d]&&state[d].done) done++;
  const streak = calcStreak(state);
  const pct = Math.round((done/31)*100);

  document.getElementById('s-done').textContent = done;
  document.getElementById('s-left').textContent = 31-done;
  document.getElementById('s-streak').textContent = streak;
  document.getElementById('s-pct').textContent = pct+'%';
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-txt').textContent = done+' / 31 days';

  // Dynamic start/end labels on progress bar
  const startDate = getStartDate();
  const d1El = document.getElementById('prog-d1');
  const d31El = document.getElementById('prog-d31');
  const planDatesEl = document.getElementById('plan-dates');
  if (startDate) {
    const start = fmtDate(dateForDay(1));
    const end   = fmtDate(dateForDay(31));
    if (d1El)  d1El.textContent  = 'Day 1 · ' + start;
    if (d31El) d31El.textContent = 'Day 31 · ' + end;
    if (planDatesEl) planDatesEl.textContent = start + ' → ' + end;
  } else {
    if (d1El)  d1El.textContent  = 'Day 1 · Start when ready';
    if (d31El) d31El.textContent = 'Day 31 · +31 days';
    if (planDatesEl) planDatesEl.textContent = 'Complete Day 1 to set your start date';
  }

  const sb = document.getElementById('streak-bar');
  if(streak >= 2) {
    sb.style.display = 'flex';
    document.getElementById('streak-num').textContent = streak;
  } else {
    sb.style.display = 'none';
  }
  // update each card's done state visually
  for(let d=1;d<=31;d++){
    const card = document.getElementById('card-'+d);
    if(!card) continue;
    const isDone = !!(state[d]&&state[d].done);
    card.classList.toggle('done', isDone);
    const tick = card.querySelector('.tick');
    if(tick) tick.textContent = isDone ? '✓' : '○';
  }
  // week progress
  WEEKS.forEach(w => {
    const el = document.getElementById('wpct-'+w.id);
    if(!el) return;
    const wDone = w.days.filter(d=>state[d]&&state[d].done).length;
    el.textContent = wDone+'/'+w.days.length;
  });
}

// ── HOUR CHECKBOX ─────────────────────────────────────────────────────────────
function toggleHour(dayId, hourIdx, el) {
  const state = getState();
  if(!state[dayId]) state[dayId] = {done:false, hours:{}};
  if(!state[dayId].hours) state[dayId].hours = {};
  state[dayId].hours[hourIdx] = !state[dayId].hours[hourIdx];
  el.classList.toggle('on', state[dayId].hours[hourIdx]);
  saveState(state);
  // auto-complete day if all 4 hours checked
  const dayData = ALL_DAYS.find(d=>d.id===dayId);
  if(dayData) {
    const total = dayData.hours.length;
    const checked = Object.values(state[dayId].hours).filter(Boolean).length;
    if(checked >= total && !state[dayId].done) {
      completeDay(dayId, true); // completeDay calls render() internally
      return;
    }
  }
  updateStats();
}

// ── COMPLETE DAY ──────────────────────────────────────────────────────────────
function completeDay(dayId, withCelebrate=true) {
  const state = getState();
  if(!state[dayId]) state[dayId] = {done:false, hours:{}};
  state[dayId].done = true;

  // Record start date the very first time Day 1 is completed
  if (dayId === 1 && !state.__startDate) {
    const today = new Date();
    const iso = today.toISOString().split('T')[0]; // "YYYY-MM-DD"
    state.__startDate = iso;
  }

  saveState(state);
  updateStats();
  // Re-render so card dates and lock states update immediately
  render();
  if(withCelebrate) {
    launchConfetti();
    showToast(QUOTES[Math.floor(Math.random()*QUOTES.length)]);
  }
  // mark all hours as checked in the freshly rendered card
  const card = document.getElementById('card-'+dayId);
  if(card) {
    card.querySelectorAll('.hchk').forEach(h=>h.classList.add('on'));
  }
}

// ── BUILD CARD ────────────────────────────────────────────────────────────────
function buildCard(day, todayNum) {
  const state = getState();
  const ds = state[day.id] || {done:false, hours:{}};
  const isDone = ds.done;
  const isToday = day.id === todayNum;
  // Day 1 is never locked. Others are locked if beyond todayNum+1 (allow peeking 1 ahead)
  const isLocked = day.id > 1 && day.id > todayNum + 1;

  // Dynamic date label: show real date if start is set, else "Day N"
  const calDate = dateForDay(day.id);
  const dateLabel = calDate ? fmtDate(calDate) : (day.id === 1 ? 'Start today — click to begin' : 'Day ' + day.id);

  const skillHTML = day.skills.map(s=>`<span class="sb sb-${s}">${s}</span>`).join('');
  // Daily essay reading: 3 "Read" chips (Read 1/2/3) — different links each day,
  // covering the full 100-essay-question bank across the 31 days.
  const readHTML = (READ_CHIPS[day.id]||[]).map(r=>
    `<a class="lchip lchip-read" href="${r.u}" target="_blank" title="${r.t} — ${r.q}">📖 Read ${r.n} · ${r.t} ${r.q}</a>`
  ).join('');
  const otherLinksHTML = day.links.map(l=>`<a class="lchip" href="${l.url}" target="_blank">${l.label}</a>`).join('');
  const linksHTML = readHTML + otherLinksHTML;
  const hoursHTML = day.hours.map((h,i) => {
    const checked = !!(ds.hours && ds.hours[i]);
    return `<div class="hr">
      <span class="hlbl">${h.label}</span>
      <div class="hchk ${checked?'on':''}" onclick="toggleHour(${day.id},${i},this)"></div>
      <div class="htxt">${h.text}</div>
    </div>`;
  }).join('');

  const classes = ['card',
    isDone  ? 'done'   : '',
    isToday ? 'today'  : '',
    isLocked? 'locked' : '',
  ].filter(Boolean).join(' ');

  const todayBadge = isToday && !isDone
    ? `<span style="position:absolute;top:9px;right:12px;font-size:.6rem;font-weight:800;
        color:var(--accent);background:#5b7fff1a;border:1px solid #5b7fff44;
        border-radius:5px;padding:1px 7px;letter-spacing:.07em;text-transform:uppercase">TODAY</span>`
    : '';
  const doneBadge = isDone ? '<span class="done-stamp">DONE ✓</span>' : '';
  const lockedIcon = isLocked ? ' 🔒' : '';

  return `<div class="${classes}" id="card-${day.id}">
    ${isDone ? doneBadge : todayBadge}
    <div class="ctop" onclick="toggleExpand(${day.id})" style="cursor:pointer">
      <div class="dnum">${day.id}</div>
      <div class="cmeta">
        <div class="cdate">${dateLabel}${lockedIcon}</div>
        <div class="ctitle">${day.title}</div>
        <div class="sbadges">${skillHTML}</div>
      </div>
      <div class="tick">${isDone?'✓':'○'}</div>
    </div>
    <div class="cbody">
      <div class="hours">${hoursHTML}</div>
      <div class="clinks">${linksHTML}</div>
      <button class="cbtn" onclick="completeDay(${day.id})">
        ${isDone ? '✓ Completed' : '✓ Mark Day Complete'}
      </button>
    </div>
  </div>`;
}

function toggleExpand(dayId) {
  const state = getState();
  if(dayId > todayDayNum()+1) return; // locked
  const card = document.getElementById('card-'+dayId);
  if(!card) return;
  // close others
  document.querySelectorAll('.card.open').forEach(c => {
    if(c.id !== 'card-'+dayId) c.classList.remove('open');
  });
  card.classList.toggle('open');
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const today = todayDayNum();
  const app = document.getElementById('app');
  app.innerHTML = '';

  WEEKS.forEach(w => {
    const state = getState();
    const wDone = w.days.filter(d=>state[d]&&state[d].done).length;
    const block = document.createElement('div');
    block.className = 'week-block';

    const daysHTML = w.days.map(dId => {
      const dayData = ALL_DAYS.find(d=>d.id===dId);
      return dayData ? buildCard(dayData, today) : '';
    }).join('');

    block.innerHTML = `
      <div class="wk-head">
        <span class="wk-badge">${w.label}</span>
        <div class="wk-info">
          <div class="wk-name">${w.name}</div>
          <div class="wk-target">${w.target}</div>
        </div>
        <span class="wk-pct" id="wpct-${w.id}">${wDone}/${w.days.length}</span>
      </div>
      <div class="days-grid">${daysHTML}</div>
    `;
    app.appendChild(block);
  });

  updateStats();

  // auto-open today's card
  const todayCard = document.getElementById('card-'+today);
  if(todayCard && !todayCard.classList.contains('done')) {
    todayCard.classList.add('open');
    setTimeout(()=>todayCard.scrollIntoView({behavior:'smooth',block:'center'}),300);
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
render();

</script>
</body>
