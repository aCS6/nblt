<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Speaking Studio — Part 1, 2 &amp; 3 Topics with Model Answers</title>
  <meta name="description" content="A free study companion for the IELTS Speaking test: Part 1 topics with band-7 model answers, 79 Part 2 cue cards with model answers and their Part 3 follow-up questions, plus search, progress tracking and practice mode." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <script>
    // set theme before first paint to avoid a flash
    (function () {
      try {
        var raw = localStorage.getItem('ss-theme');
        var t = raw ? JSON.parse(raw) : 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- NBLT hub: floating "back to home" pill. Optional — the app runs without it. -->
  <script defer src="../assets/nblt-home.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <!-- Reading progress bar -->
  <div class="reading-bar" id="readingBar" aria-hidden="true"></div>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <a class="brand" href="#/" aria-label="IELTS Speaking Studio — home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30" fill="none">
          <rect x="2" y="6" width="24" height="17" rx="6" fill="currentColor" opacity=".92"/>
          <path d="M10 25l4-3h6" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <path d="M9 12.5h10M9 16.5h6.5" stroke="var(--surface)" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Speaking Studio</span>
        <span class="brand-sub">IELTS practice companion</span>
      </span>
    </a>

    <div class="topbar-right">
      <button class="search-trigger" id="searchTrigger" aria-label="Search all content">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>Search</span>
        <kbd>/</kbd>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle light / dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></svg>
      </button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Site navigation">
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot" id="progressCard"></div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main id="view" tabindex="-1"></main>

  <!-- Search overlay -->
  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search topics, questions, cue cards, answers…" autocomplete="off" spellcheck="false" />
        <button class="icon-btn" id="searchClose" aria-label="Close search">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
